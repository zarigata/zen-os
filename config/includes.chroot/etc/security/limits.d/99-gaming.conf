# ZEN-OS Gaming Limits
# Higher limits for gaming processes

# Max open files for all users (games + Proton + Wine)
* soft nofile 524288
* hard nofile 524288

# Realtime priority for audio (PipeWire)
@audio soft rtprio 95
@audio hard rtprio 95
@audio soft memlock unlimited
@audio hard memlock unlimited

# Gaming group gets nice priority
@gamemode soft nice -10
@gamemode hard nice -15
