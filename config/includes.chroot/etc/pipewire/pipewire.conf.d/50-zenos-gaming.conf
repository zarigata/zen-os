# ZEN-OS PipeWire Gaming Configuration
# Low-latency audio profile optimized for gaming
# Quantum 256 = ~5.3ms latency at 48kHz
# Override with 99-zenos-gaming.conf for ultra-low latency (quantum 128)

context.properties = {
    default.clock.rate = 48000
    default.clock.quantum = 256
    default.clock.min-quantum = 128
    default.clock.max-quantum = 2048
    default.clock.allowed-rates = [ 44100, 48000, 96000 ]

    # Disable resampling for lower latency
    link.max-buffers = 16

    # Core settings
    core.daemon = true
    core.name = pipewire-0

    # Log level (0=none, 1=error, 2=warn, 3=info, 4=debug)
    log.level = 2

    # Memory settings for gaming
    mem.allow-mlock = true
    mem.mlock-all = false
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    # Protocol
    { name = libpipewire-module-protocol-native }

    # Profile
    { name = libpipewire-module-profiler }

    # RTKit for real-time scheduling
    { name = libpipewire-module-rt
        args = {
            nice.level    = -11
            rt.prio       = 88
            rt.time.soft  = 2000000
            rt.time.hard  = 2000000
        }
        flags = [ ifexists nofail ]
    }

    # DBus
    { name = libpipewire-module-protocol-dbus
        flags = [ ifexists nofail ]
    }

    # Client-node
    { name = libpipewire-module-client-node }

    # Client-device
    { name = libpipewire-module-client-device }

    # Metadata
    { name = libpipewire-module-metadata }

    # Session-manager (WirePlumber handles this)
    { name = libpipewire-module-session-manager
        flags = [ ifexists nofail ]
    }
]
