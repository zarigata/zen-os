# ZEN-OS OpenSSH hardening
# SSH is disabled by default. Enable it explicitly from ZEN-OS Security Center.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
IgnoreRhosts yes
HostbasedAuthentication no
MaxAuthTries 3
MaxSessions 5
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
UsePAM yes

# Do not pin cipher/MAC/KEX lists here. Debian/OpenSSH defaults evolve as
# algorithms are deprecated, which avoids turning a static distro config stale.
