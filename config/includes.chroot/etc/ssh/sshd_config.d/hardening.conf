# /etc/ssh/sshd_config.d/hardening.conf — ZEN-OS SSH hardening
# Applied on top of default Debian sshd_config

# Disable root login
PermitRootLogin no

# Disable password auth — keys only (can be relaxed for live session)
# PasswordAuthentication no

# Disable empty passwords
PermitEmptyPasswords no

# Disable X11 forwarding (security risk)
X11Forwarding no

# Max auth tries
MaxAuthTries 3

# Login grace time (60 seconds)
LoginGraceTime 60

# Disable .rhosts authentication
IgnoreRhosts yes
HostbasedAuthentication no

# Use strong ciphers
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
KexAlgorithms curve25519-sha256@libssh.org,diffie-hellman-group16-sha512

# Client alive interval (keepalive)
ClientAliveInterval 300
ClientAliveCountMax 2

# Log level
LogLevel VERBOSE

# Allow only specific groups (sudo users + live-user)
AllowGroups sudo live-user
