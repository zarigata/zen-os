# MangoHud default config — ZEN-OS
# Shows FPS, frame timing, CPU/GPU usage during games
# Toggle with right Shift + F12

preset=0
fps_limit=0
toggle_fps_limit=F1

# Performance overlay
fps
frame_timing
cpu_stats
gpu_stats
ram
vram

# Position and style
position=top-left
horizontal_stretch=0.5
background_alpha=0.3
font_size=14

# Executable black/whitelist
# no_display=steam,nvidia-settings
