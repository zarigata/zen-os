# ZEN-OS Gaming Optimizations
# Aggressive sysctl tuning for gaming performance

# Memory — reduce swap tendency, keep games in RAM
vm.swappiness=10

# Max memory map count — needed for Wine/Proton games (especially Overwatch, CS2)
vm.max_map_count=2147483642

# File descriptors — games need many open files
fs.file-max=524288

# Scheduler — autogroup helps desktop responsiveness under load
kernel.sched_autogroup_enabled=1

# NUMA balancing — disable to reduce latency on multi-socket systems
kernel.numa_balancing=0

# Scheduler latency — reduce for faster task switching
kernel.sched_latency_ns=10000000
kernel.sched_migration_cost_ns=5000000

# Compact memory proactively to avoid allocation stalls
vm.compaction_proactiveness=20

# Page lock fairness — prevents one process from monopolizing page locks
vm.page_lock_unfairness=1

# Net — increase network buffer sizes for online gaming
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.rmem_default=1048576
net.core.wmem_default=1048576
net.ipv4.tcp_rmem=4096 1048576 16777216
net.ipv4.tcp_wmem=4096 1048576 16777216
net.ipv4.tcp_fastopen=3

# Inotify — increase watches for game launchers (Steam, Lutris)
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=512
