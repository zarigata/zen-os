# Force text mode for serial console compatibility
set default=0
set timeout=5
set pager=1

# Text mode — no gfxterm
set gfxmode=text
terminal_output console
terminal_input console

menuentry "ZEN-OS Live (Liquorix kernel)" {
    linux /live/vmlinuz-7.0.5-1-liquorix-amd64 boot=live components locales=en_US.UTF-8 keyboard-layouts=us quiet apparmor=1 security=apparmor console=ttyS0,115200
    initrd /live/initrd.img-7.0.5-1-liquorix-amd64
}

menuentry "ZEN-OS Live (Debian kernel)" {
    linux /live/vmlinuz-6.12.86+deb13-amd64 boot=live components locales=en_US.UTF-8 keyboard-layouts=us quiet apparmor=1 security=apparmor console=ttyS0,115200
    initrd /live/initrd.img-6.12.86+deb13-amd64
}

menuentry "ZEN-OS Live (fail-safe mode)" {
    linux /live/vmlinuz-6.12.86+deb13-amd64 boot=live components memtest noapic noapm nodma nomce nosmp nosplash vga=788 console=ttyS0,115200
    initrd /live/initrd.img-6.12.86+deb13-amd64
}
